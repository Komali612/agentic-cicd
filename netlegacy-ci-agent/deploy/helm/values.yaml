# Per-agent Helm values. The chart itself is frozen.
image:
  repository: netlegacy-ci-agent
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8080

env:
  AGENT_NAME: netlegacy-ci
  AGENT_LOG_LEVEL: INFO

# GITHUB_TOKEN is a secret — create a k8s Secret and reference it here:
#   kubectl create secret generic netlegacy-ci-secrets --from-literal=github-token=ghp_xxx
secretEnv:
  GITHUB_TOKEN: {name: netlegacy-ci-secrets, key: github-token}

resources: {}
