# Per-agent Helm values. The chart itself is frozen.
image:
  repository: orchestrator-agent
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8080

env:
  AGENT_NAME: orchestrator
  AGENT_LOG_LEVEL: INFO
  WORKER_NETCORE_CI_URL: http://netcore-ci:8080
  WORKER_NETLEGACY_CI_URL: http://netlegacy-ci:8080

# Secrets. The `orchestrator-secrets` Secret is created + synced by the Doppler
# Kubernetes Operator (keys = Doppler secret names). See ../../SECRETS.md.
# GITHUB_TOKEN is needed for private repos/orgs; ANTHROPIC_API_KEY enables
# LLM-assisted classification.
secretEnv:
  GITHUB_TOKEN: {name: orchestrator-secrets, key: GITHUB_TOKEN}
  # ANTHROPIC_API_KEY: {name: orchestrator-secrets, key: ANTHROPIC_API_KEY}

resources: {}
