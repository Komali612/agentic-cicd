# Per-agent Helm values. The chart itself is frozen.
image:
  repository: netcore-ci-agent
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 8080

env:
  AGENT_NAME: netcore-ci
  AGENT_LOG_LEVEL: INFO

# GITHUB_TOKEN is a secret. The `netcore-ci-secrets` Secret is created + synced
# by the Doppler Kubernetes Operator (keys = Doppler secret names). See ../../SECRETS.md.
secretEnv:
  GITHUB_TOKEN: {name: netcore-ci-secrets, key: GITHUB_TOKEN}

resources: {}
