[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netcore-ci-agent"
version = "0.1.0"
description = "NetCoreCI agent — authors CI pipelines for .NET Core 6/7/8 (AKS) repositories."
requires-python = ">=3.11"
dependencies = [
    "agent-core[anthropic] @ git+https://github.com/Komali612/agent-core@v0.2.0",
    "agent-contracts>=0.1",
    "ci-authoring>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent = "agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.hatch.metadata]
# agent-core is a direct (git URL) reference; hatchling requires opting in.
allow-direct-references = true

[tool.ruff]
line-length = 100
