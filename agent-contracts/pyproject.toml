[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-contracts"
version = "0.1.0"
description = "Shared data contracts and inter-agent client for the Agentic CI/CD framework."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contracts"]

[tool.ruff]
line-length = 100
